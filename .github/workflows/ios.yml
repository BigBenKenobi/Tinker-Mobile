name: iPhone companion
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      simulator_tests:
        description: Run the Simulator regression suite
        type: boolean
        default: true
      full_capture:
        description: Run all UI cases and retain full screenshot evidence
        type: boolean
        default: false
      device_build:
        description: Build an unsigned IPA for physical acceptance
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ios-${{ github.head_ref || github.ref_name }}-${{ github.event_name == 'workflow_dispatch' && 'acceptance' || 'regression' }}
  cancel-in-progress: true
jobs:
  simulator:
    if: github.event_name != 'workflow_dispatch' || inputs.simulator_tests
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    strategy:
      fail-fast: false
      matrix:
        phone: [small, large]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Choose regression or full visual suite
        env:
          CAPTURE_REQUESTED: ${{ inputs.full_capture }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          full=false
          if [ "$CAPTURE_REQUESTED" = true ]; then
            full=true
          elif [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA" 2>/dev/null; then
            if git diff --name-only "$BASE_SHA" HEAD | grep -Eq '^ios/(TinkerCompanion/(Shell/|Productivity/|Appearance/|Shared/|Workspaces/|Companion/|.*View.swift)|TinkerCompanionUITests/)'; then full=true; fi
          fi
          echo "FULL_CAPTURE=$full" >> "$GITHUB_ENV"
      - name: Verify generated Xcode project is current
        run: |
          python3 scripts/generate_xcode_project.py
          git diff --exit-code -- ios/TinkerCompanion.xcodeproj
      - name: Pick an available iPhone Simulator
        run: |
          xcodebuild -version
          xcrun simctl list devices available -j > /tmp/tinker-simulators.json
          python3 - <<'PY'
          import json, os
          data = json.load(open('/tmp/tinker-simulators.json'))
          devices = [d for runtime, values in data['devices'].items() if runtime.endswith('iOS-18-5') for d in values if d['name'].startswith('iPhone')]
          if not devices:
              raise SystemExit('No iPhone Simulator installed')
          size = "${{ matrix.phone }}"
          preferred = ['iPhone SE (3rd generation)'] if size == 'small' else ['iPhone 16 Pro Max']
          selected = next((d for name in preferred for d in devices if d['name'] == name), None)
          if selected is None:
              raise SystemExit('No supported ' + size + ' iPhone Simulator installed')
          print('Selected Simulator:', selected['name'], selected['udid'])
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('TINKER_SIMULATOR_ID=' + selected['udid'] + '\n')
          PY
      - name: Validate project generator
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Build and test native iPhone app
        run: |
          set +e
          set -o pipefail
          selection=()
          if [ "$FULL_CAPTURE" != true ]; then
            selection=(-skip-testing:TinkerCompanionUITests/PresentationTests/testDestinationScreenshots -skip-testing:TinkerCompanionUITests/PresentationTests/testPopulatedAndErrorFixturesWithLargeText)
          fi
          xcodebuild -project ios/TinkerCompanion.xcodeproj -scheme TinkerCompanion -destination "platform=iOS Simulator,id=$TINKER_SIMULATOR_ID" -resultBundlePath /tmp/TinkerCompanion.xcresult CODE_SIGNING_ALLOWED=NO CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" TINKER_SOURCE_REVISION="$(git rev-parse HEAD)" "${selection[@]}" test 2>&1 | tee "$RUNNER_TEMP/tinker-xcode.log"
          xcode_status=${PIPESTATUS[0]}
          python3 scripts/annotate_xcode_errors.py "$RUNNER_TEMP/tinker-xcode.log"
          python3 scripts/summarize_xcresult.py /tmp/TinkerCompanion.xcresult "$RUNNER_TEMP/tinker-test-summary.json"
          summary_status=$?
          if [ "$xcode_status" -eq 0 ]; then exit "$summary_status"; fi
          exit "$xcode_status"
      - name: Export screenshot attachments
        if: always() && env.FULL_CAPTURE == 'true'
        run: |
          xcrun xcresulttool export attachments --path /tmp/TinkerCompanion.xcresult --output-path "$RUNNER_TEMP/tinker-screenshots"
          python3 - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'tinker-screenshots'
          images = [p for p in root.rglob('*') if p.suffix.lower() in ('.png', '.jpg', '.jpeg')]
          print('::notice title=XCTest screenshots::Exported ' + str(len(images)) + ' image attachments')
          PY
      - name: Record exact build evidence
        if: always()
        run: python3 scripts/record_build_evidence.py --kind simulator --summary "$RUNNER_TEMP/tinker-test-summary.json" --output "$RUNNER_TEMP/validation.json"
      - name: Preserve compact validation manifest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validation-${{ matrix.phone }}
          path: ${{ runner.temp }}/validation.json
          retention-days: 90
      - name: Export native diagnostics
        if: always()
        run: xcrun xcresulttool export diagnostics --path /tmp/TinkerCompanion.xcresult --output-path "$RUNNER_TEMP/tinker-diagnostics"
      - name: Preserve Xcode results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xcode-results-${{ matrix.phone }}
          path: |
            /tmp/TinkerCompanion.xcresult
            ${{ runner.temp }}/tinker-xcode.log
            ${{ runner.temp }}/tinker-test-summary.json
            ${{ runner.temp }}/tinker-screenshots
            ${{ runner.temp }}/tinker-diagnostics
          retention-days: 14
  unsigned-device-ipa:
    if: github.event_name == 'workflow_dispatch' && inputs.device_build
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Confirm Xcode 26 toolchain
        run: |
          xcodebuild -version > "$RUNNER_TEMP/xcode-version.txt"
          cat "$RUNNER_TEMP/xcode-version.txt"
          grep -Fx 'Xcode 26.6' "$RUNNER_TEMP/xcode-version.txt"
      - name: Build unsigned iPhone app
        run: |
          xcodebuild -project ios/TinkerCompanion.xcodeproj \
            -scheme TinkerCompanion -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/tinker-device-build" \
            CODE_SIGNING_ALLOWED=NO CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" TINKER_SOURCE_REVISION="$(git rev-parse HEAD)" build
      - name: Package SideStore IPA
        run: |
          app="$RUNNER_TEMP/tinker-device-build/Build/Products/Release-iphoneos/TinkerCompanion.app"
          test -d "$app"
          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")
          test "$bundle_id" = 'com.bigbenkenobi.tinker-companion'
          if codesign -dv "$app" >/dev/null 2>&1; then
            echo 'Expected an unsigned device app' >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/tinker-ipa/Payload"
          cp -R "$app" "$RUNNER_TEMP/tinker-ipa/Payload/"
          cd "$RUNNER_TEMP/tinker-ipa"
          zip -qry "$RUNNER_TEMP/TinkerCompanion-unsigned.ipa" Payload
      - name: Record device payload provenance
        run: python3 scripts/record_build_evidence.py --kind unsigned-device --payload "$RUNNER_TEMP/TinkerCompanion-unsigned.ipa" --output "$RUNNER_TEMP/device-validation.json"
      - name: Preserve compact device manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validation-unsigned-device
          path: ${{ runner.temp }}/device-validation.json
          retention-days: 90
      - name: Retain unsigned IPA for acceptance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: TinkerCompanion-unsigned-device-ipa
          path: ${{ runner.temp }}/TinkerCompanion-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
